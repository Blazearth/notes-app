spring:
  application:
    name: weavr-api

  # --------------------------------------------------------------------------
  # RUNTIME datasource -> Supavisor TRANSACTION pooler (port 6543).
  # --------------------------------------------------------------------------
  # Free-tier direct connections are few and a HikariCP pool will exhaust them.
  # Two non-negotiables on this path:
  #   * prepareThreshold=0 in the URL - the transaction pooler does not keep a
  #     session, so server-side prepared statements produce intermittent
  #     "prepared statement S_1 already exists" errors under load.
  #   * a small pool.
  # See WEAVR_DB_URL in .env.example.
  datasource:
    url: ${WEAVR_DB_URL}
    username: ${WEAVR_DB_USER}
    password: ${WEAVR_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${WEAVR_DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: weavr-pool

  # --------------------------------------------------------------------------
  # MIGRATION datasource -> SESSION pooler (port 5432) or a direct connection.
  # --------------------------------------------------------------------------
  # Deliberately a different URL from the one above. Flyway takes a
  # session-level advisory lock and runs DDL inside transactions; both break
  # under the transaction pooler. This is easy to miss because it usually works
  # on the first migration and fails later, under concurrency.
  flyway:
    enabled: true
    url: ${WEAVR_FLYWAY_URL}
    user: ${WEAVR_FLYWAY_USER}
    password: ${WEAVR_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    # Supabase ships a populated schema (auth, storage, ...) so the public
    # schema is not "empty" from Flyway's point of view.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate never writes DDL.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25

  security:
    oauth2:
      resourceserver:
        jwt:
          # Decoder is built explicitly in SecurityConfig so issuer and
          # audience validation are visible rather than implied, and so we
          # never depend on Supabase serving an OIDC discovery document.
          jwk-set-uri: ${weavr.supabase.url}/auth/v1/.well-known/jwks.json

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

weavr:
  # --------------------------------------------------------------------------
  # Job runner — the pipeline backbone.
  # --------------------------------------------------------------------------
  # concurrency stays at 1-2 on a free-tier instance. The work is yt-dlp, ffmpeg
  # and OCR as external processes: they are CPU- and memory-hungry, and parallel
  # jobs OOM rather than queue. The property is capped at 4 to make raising it
  # a deliberate act.
  jobs:
    enabled: ${WEAVR_JOBS_ENABLED:true}
    concurrency: ${WEAVR_JOBS_CONCURRENCY:2}
    poll-interval: 2s
    # Exponential from here: 30s, 2m, 8m, 32m, then capped.
    retry-base-delay: 30s
    retry-max-delay: 1h
    # A job still `running` after this is assumed to belong to a dead process
    # and is returned to the queue.
    stale-after: 15m

  # --------------------------------------------------------------------------
  # yt-dlp — the free half of the extraction cascade.
  # --------------------------------------------------------------------------
  # The container MUST install this; a plain JRE base image has neither yt-dlp
  # nor ffmpeg. Neither call downloads media: both pass --skip-download, and the
  # probe writes nothing to disk at all.
  #
  # Pin vs update-on-start is a real trade: extractors break whenever a platform
  # changes, so pinning is reproducible but rots. For a two-month hackathon,
  # update-on-start is usually right.
  ytdlp:
    binary: ${WEAVR_YTDLP_BINARY:yt-dlp}
    probe-timeout: 60s
    caption-timeout: 90s
    # Exact codes, NOT a regex. Each entry is matched as a pattern, and yt-dlp
    # synthesises translated tracks named `<source>-<target>`, so `en.*` pulls
    # in en-ar, en-ja, en-ru and the rest — 29 downloads for one TED talk, and
    # a 429 partway through. `en` is the English track (an uploaded one wins
    # over a machine caption); `en-orig` is the original-language track.
    subtitle-langs: ${WEAVR_YTDLP_SUB_LANGS:en,en-orig}
    # Bound on the ASR audio download. Generous relative to the 90s duration
    # cap on the download itself — this timeout covers slow networks, not
    # long audio.
    audio-timeout: 120s
    # The OCR tier's video download. Longer than the audio one: a video stream
    # is an order of magnitude larger even at the worst usable quality.
    video-timeout: 180s
    # The video is a means to frames, never something to keep. Overlay text is
    # sized for phone screens, so the worst stream that still has legible text
    # is the right one. `/worst` catches sources whose every stream is below
    # 360p, which would otherwise match nothing and fail.
    video-format: ${WEAVR_YTDLP_VIDEO_FORMAT:worst[height>=360]/worst}
    # Base64-encoded Netscape cookies file. Export from a logged-in browser
    # with a cookies.txt extension, then: base64 -w 0 cookies.txt
    cookies-base64: ${WEAVR_YTDLP_COOKIES_BASE64:}
    # --extractor-args youtube:player_client=... . On Render, cookies alone did
    # NOT clear "Sign in to confirm you're not a bot" — a cookie exported on a
    # residential machine and replayed from an unrelated cloud IP is itself a
    # signal, and the `web` client's challenge wants a PO token cookies don't
    # supply. `tv` and `android` use a simpler flow that doesn't ask for one.
    # Empirical, not guaranteed — verify against the real deploy.
    player-clients: ${WEAVR_YTDLP_PLAYER_CLIENTS:tv,android,web}

  # --------------------------------------------------------------------------
  # ffmpeg — downmixes ASR audio to 16 kHz mono before it goes to Groq.
  # --------------------------------------------------------------------------
  ffmpeg:
    binary: ${WEAVR_FFMPEG_BINARY:ffmpeg}
    timeout: 60s

  # --------------------------------------------------------------------------
  # OCR — the visual tier. Step 5, reached only when 1-4 produced nothing.
  # --------------------------------------------------------------------------
  # The hard case this exists for: a recipe Reel whose ingredients are only
  # on-screen overlay text — no caption, no description, no voiceover. Common,
  # and invisible to every step above.
  #
  # Do NOT use the vision model as the OCR engine. Vision is the most expensive
  # path in the system and it burns the scarcer Flash pool. Read the text
  # locally, then feed the *text* into the cheap classify call like any other
  # save; vision is the fallback, not the default (CLAUDE.md).
  #
  # min-mean-confidence is the LLM repair floor, and it is currently a *guess*.
  # LLM reconstruction works at roughly 70-80% correct OCR and does not work at
  # 20% — below the floor the model doesn't repair, it invents plausible
  # ingredients, which is worse than failing. Phase 4's eval set (30 hand-
  # labelled Reels) is what turns this number into a measurement.
  ocr:
    enabled: ${WEAVR_OCR_ENABLED:true}
    binary: ${WEAVR_TESSERACT_BINARY:tesseract}
    language: eng
    # 6 = one uniform block of text, which is what a burned-in overlay card is.
    # 11 (sparse text) is the alternative worth measuring on the eval set.
    page-segmentation: 6
    timeout: 30s
    max-video-seconds: ${WEAVR_OCR_MAX_VIDEO_SECONDS:90}
    # Each frame is its own tesseract process, so this is the real cost knob.
    max-frames: ${WEAVR_OCR_MAX_FRAMES:12}
    scene-threshold: 0.25
    # A static ingredient card has no scene changes at all, so scene detection
    # alone selects nothing on exactly the videos this tier exists for.
    periodic-sample-frames: 150
    # Preprocessing for the OCR branch. Upscale and greyscale only — NO
    # contrast stage. Overlay text is high-contrast and bimodal by design, and
    # a global equalisation (histeq, the obvious choice) measurably damages it:
    # a white-on-near-black card comes back mid-grey with hollowed, speckled
    # glyphs. Text over a photographic background is a different problem and
    # may want one; the eval set is what should decide, hence a property.
    frame-filters: ${WEAVR_OCR_FRAME_FILTERS:scale=iw*2:-2:flags=lanczos,format=gray}
    min-mean-confidence: ${WEAVR_OCR_MIN_CONFIDENCE:60}
    min-words: 8
    min-alpha-ratio: 0.5
    min-frame-votes: 2
    vision-escalation: ${WEAVR_OCR_VISION_ESCALATION:true}
    vision-frames: 4

  # --------------------------------------------------------------------------
  # Groq — Whisper ASR. Step 3 of the extraction cascade, the last resort
  # before a save fails as unclassifiable.
  # --------------------------------------------------------------------------
  # A different provider from Gemini on purpose: its own key, its own
  # rate-limit pool, so a transcription never spends Gemini's daily RPD.
  # max-audio-seconds bounds what yt-dlp downloads — CLAUDE.md § bound
  # everything — so a 3-hour video costs the same as a 90-second Reel.
  groq:
    api-key: ${WEAVR_GROQ_API_KEY:}
    model: whisper-large-v3-turbo
    timeout: 30s
    max-audio-seconds: ${WEAVR_GROQ_MAX_AUDIO_SECONDS:90}

  # --------------------------------------------------------------------------
  # Gemini — AI classification + extraction.
  # --------------------------------------------------------------------------
  # primary-model: used for every save (500 RPD on free tier).
  # fallback-model: used when primary returns confidence < threshold (20 RPD).
  # confidence-threshold: below this, retry with fallback model.
  # primary-rpd / fallback-rpd: the daily request budget ceiling per model.
  # Counters live in ai_budget_days (US/Pacific reset timezone, matching Google).
  gemini:
    api-key: ${WEAVR_GEMINI_API_KEY}
    primary-model: gemini-3.1-flash-lite
    fallback-model: gemini-2.5-flash
    primary-rpd: ${WEAVR_GEMINI_PRIMARY_RPD:500}
    fallback-rpd: ${WEAVR_GEMINI_FALLBACK_RPD:20}
    confidence-threshold: ${WEAVR_GEMINI_CONFIDENCE_THRESHOLD:0.7}
    timeout: 30s

  # --------------------------------------------------------------------------
  # Embeddings — semantic search. A SEPARATE rate-limit pool from generation.
  # --------------------------------------------------------------------------
  # This is the one Gemini call in the codebase that does NOT go through
  # BudgetApproved, and deliberately: embeddings draw on their own, much larger
  # pool, so counting them against the 500/day save budget would throttle saves
  # for nothing. Re-embedding backfills are not a budget event.
  #
  # dimensions MUST stay 1536. gemini-embedding-001 returns 3072 by default and
  # saves.embedding is vector(1536), baked into V1's DDL — changing it is a
  # migration PLUS a full re-embedding backfill, i.e. a one-way door. The
  # application refuses to start on any other value rather than failing one row
  # at a time in a background job, far from the cause.
  embedding:
    model: gemini-embedding-001
    dimensions: 1536
    timeout: 30s
    max-chars: 8000
    batch-size: 25

  # --------------------------------------------------------------------------
  # Search — Postgres FTS + pgvector, fused with Reciprocal Rank Fusion.
  # --------------------------------------------------------------------------
  # max-semantic-distance exists because a k-NN search has no concept of "no
  # match": it returns the nearest k however far away they are. Observed live
  # before this existed, searching "zzzzqqq" returned the user's entire
  # library — "nothing matched" looked identical to "here is everything".
  #
  # 0.40 was measured, not remembered. Real queries against real saves:
  #   hits    "Noma" 0.266 · "somewhere nice to eat in Denmark" 0.335
  #           "Christopher Nolan" 0.358 · "what should I cook tonight" 0.366
  #   misses  "zzzzqqq" 0.425 · "renew a passport" 0.490 · "quantum …" 0.499
  # The gap is real, but the sample was three saves and seven queries — treat
  # this as provisional, like the OCR confidence floor, not as calibrated.
  search:
    max-semantic-distance: ${WEAVR_SEARCH_MAX_DISTANCE:0.40}
    candidate-depth: 50

  # --------------------------------------------------------------------------
  # Spaces — collaboration, and duplicate detection inside a shared one.
  # --------------------------------------------------------------------------
  # Two people save the same restaurant, one from a Reel and one from a Maps
  # link, calling it different things. Exact-URL matching — as far as every
  # competitor in the teardown goes — sees nothing in common; the embedding
  # does, because it was built from structured_data rather than the URL.
  #
  # duplicate-max-distance is a GUESS, argued rather than measured, exactly
  # like the OCR confidence floor. The reasoning: the search half measured real
  # query hits at 0.27-0.37, and two saves of the *same thing* must be far
  # closer than a query that merely describes one — anything in that range
  # would declare every restaurant in a Space the same restaurant. A corpus of
  # real duplicate pairs is what turns 0.15 into a number.
  spaces:
    duplicate-detection-enabled: ${WEAVR_DUPLICATE_DETECTION:true}
    duplicate-max-distance: ${WEAVR_DUPLICATE_MAX_DISTANCE:0.15}
    duplicate-max-suggestions: 3

  # --------------------------------------------------------------------------
  # Enrichment — external APIs that fill gaps the content itself never had.
  # --------------------------------------------------------------------------
  # Costs NO Gemini request, which is the whole reason it is worth doing on a
  # 500-a-day budget: TMDB knows the director for free, and asking a model to
  # recall one is both a request and a hallucination risk.
  #
  # Runs BETWEEN classify and embed, not after. The embedding is built from
  # structured_data, so embedding first would permanently omit the director,
  # the address and the coordinates — the highest-signal terms a semantic
  # search has to match on.
  #
  # Every key is optional and a missing one disables only its own enricher.
  # Enrichment happens to a save that is already `ready` and already
  # searchable, so it must never be able to fail one.
  #
  # tmdb-api-key is the v4 READ ACCESS TOKEN (sent as a bearer), not the v3 API
  # key — the v3 key goes in a query parameter and will 401 against this code.
  enrich:
    enabled: ${WEAVR_ENRICH_ENABLED:true}
    tmdb-api-key: ${WEAVR_TMDB_API_KEY:}
    google-places-api-key: ${WEAVR_GOOGLE_PLACES_API_KEY:}
    timeout: 10s

  # --------------------------------------------------------------------------
  # Billing — RevenueCat entitlements and the free-tier caps.
  # --------------------------------------------------------------------------
  # Entitlements are enforced SERVER-SIDE. A client-only check is trivially
  # bypassed and the gated resource — a slice of a shared 500-a-day Gemini pool
  # — is the expensive one.
  #
  # webhook-secret is the Authorization header value configured on the webhook
  # in the RevenueCat dashboard. Unset DISABLES the endpoint rather than opening
  # it: the route that decides who has paid must fail closed, and "it worked in
  # dev" is exactly how the opposite ships.
  #
  # enforce-free-caps is OFF by default, and that is a product decision rather
  # than an unfinished one. A cap is only meaningful once there is a paid tier
  # to escape to, and until the store records and RevenueCat products exist,
  # nobody can subscribe — enforcing now would cap every user with no way out.
  # The counters run either way, so the switch can be flipped against real
  # numbers instead of an empty table.
  billing:
    webhook-secret: ${WEAVR_REVENUECAT_WEBHOOK_SECRET:}
    entitlement-id: ${WEAVR_ENTITLEMENT_ID:pro}
    free-saves-per-month: ${WEAVR_FREE_SAVES_PER_MONTH:20}
    free-acts-per-week: ${WEAVR_FREE_ACTS_PER_WEEK:1}
    enforce-free-caps: ${WEAVR_ENFORCE_FREE_CAPS:false}

  supabase:
    # e.g. https://sgjpiordywdklzhlhmwq.supabase.co
    url: ${WEAVR_SUPABASE_URL}
    # Supabase mints access tokens with aud=authenticated for signed-in users.
    jwt-audience: authenticated

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.weavr.api: ${WEAVR_LOG_LEVEL:INFO}
    org.flywaydb: INFO
