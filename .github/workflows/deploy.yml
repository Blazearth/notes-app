name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "Dockerfile"
      - "render.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is empty or unset -- check repo secrets."
            exit 1
          fi

          # Capture status and body separately rather than `curl | jq` --
          # that swallowed the actual response on failure and crashed jq with
          # a cryptic parse error instead of showing what Render sent back.
          #
          # The status code is the ONLY success signal: verified live that
          # Render's deploy hook responds 202 with a plain-text "Accepted"
          # body on a real, working trigger -- not the JSON object the
          # authenticated Deploys API (POST /v1/services/{id}/deploys)
          # returns. The original `| jq .` assumed every Render endpoint
          # returns JSON; this one doesn't, on success or failure. Pretty-
          # print the body only if it happens to parse as JSON; otherwise
          # print it raw. Either way, a 2xx never fails the job.
          http_code=$(curl -s -o /tmp/render_hook_response.json -w "%{http_code}" -X POST "$HOOK_URL")
          echo "HTTP status: $http_code"
          echo "Response body:"
          jq . /tmp/render_hook_response.json 2>/dev/null || cat /tmp/render_hook_response.json
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $http_code -- see response body above."
            exit 1
          fi
