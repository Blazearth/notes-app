name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "Dockerfile"
      - "render.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            | jq .
