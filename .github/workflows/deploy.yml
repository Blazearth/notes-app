name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "Dockerfile"
      - "render.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is empty or unset -- check repo secrets."
            exit 1
          fi

          # Capture status and body separately. A plain `curl | jq` swallows
          # the actual response on failure -- this project's own deploy hook
          # hit that blind spot: a non-JSON (or empty) body crashed jq with a
          # cryptic parse error instead of showing what Render actually sent
          # back, and this trigger is redundant with Render's own native
          # auto-deploy on push, so the failure went unnoticed for a while.
          http_code=$(curl -s -o /tmp/render_hook_response.json -w "%{http_code}" -X POST "$HOOK_URL")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/render_hook_response.json
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $http_code -- see response body above."
            exit 1
          fi

          if ! jq . /tmp/render_hook_response.json > /dev/null 2>&1; then
            echo "::error::Render deploy hook returned HTTP $http_code but a non-JSON body -- the hook URL is likely stale. Regenerate it in the Render dashboard (Service -> Settings -> Deploy Hook) and update the RENDER_DEPLOY_HOOK_URL repo secret."
            exit 1
          fi

          jq . /tmp/render_hook_response.json
