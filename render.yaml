services:
  - type: web
    name: weavr-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Build context is the repo root so the Dockerfile can reach api/
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      # ── Supabase ────────────────────────────────────────────────────────────
      - key: WEAVR_SUPABASE_URL
        sync: false
      - key: WEAVR_DB_URL
        sync: false
      - key: WEAVR_DB_USER
        sync: false
      - key: WEAVR_DB_PASSWORD
        sync: false
      - key: WEAVR_DB_POOL_MAX
        # 3 → 5 (2026-08-05) → 10 (2026-08-15).
        #
        # 3 was measured saturating under ordinary manual test traffic:
        # "Connection is not available, request timed out after 12502ms
        # (total=3, active=3, idle=0, waiting=1)" from a couple of concurrent
        # requests, not a load test.
        #
        # 10 is sized against the job LANES rather than picked. At peak the
        # runner holds one connection per running job — fast(4) + heavy(1) = 5 —
        # plus brief claim queries from two pollers. Leaving 5 undersized would
        # mean job work could consume the entire pool and starve HTTP, which is
        # precisely the failure above. 10 is the top of CLAUDE.md's own ~5-10
        # guidance for Supabase free tier.
        #
        # Raising the fast lane means re-checking this: keep
        # fast_concurrency <= pool_max - 5.
        value: "10"
      - key: WEAVR_FLYWAY_URL
        sync: false
      - key: WEAVR_FLYWAY_USER
        sync: false
      - key: WEAVR_FLYWAY_PASSWORD
        sync: false

      # ── Gemini ──────────────────────────────────────────────────────────────
      - key: WEAVR_GEMINI_API_KEY
        sync: false

      # ── Groq (ASR) — optional; missing disables ASR step ───────────────────
      - key: WEAVR_GROQ_API_KEY
        sync: false

      # ── Enrichment — optional; missing disables only that enricher ──────────
      - key: WEAVR_TMDB_API_KEY
        sync: false
      - key: WEAVR_GOOGLE_PLACES_API_KEY
        sync: false

      # ── RevenueCat — unset means endpoint is disabled (fails closed) ────────
      - key: WEAVR_REVENUECAT_WEBHOOK_SECRET
        sync: false

      # ── App ─────────────────────────────────────────────────────────────────
      - key: PORT
        value: "8080"
      - key: WEAVR_LOG_LEVEL
        value: "INFO"
      # Job LANES. A lane is a cost class — see docs/parallel-processing.md §3.
      # `WEAVR_JOBS_CONCURRENCY` is now the legacy single-pool size and applies
      # only if lanes are unconfigured; the two below are what actually take
      # effect.
      - key: WEAVR_JOBS_CONCURRENCY
        value: "1"
      # Network-bound (Gemini, TMDB, embeddings). Bounded by the DB pool, not
      # the CPU. Requires the Gemini RPM limiter, which is now in place.
      - key: WEAVR_JOBS_FAST_CONCURRENCY
        value: "4"
      # CPU/memory-bound (yt-dlp, ffmpeg, tesseract). STAYS AT 1 on a 512 MB /
      # 0.1 CPU free instance — parallel media jobs OOM rather than queue. Do
      # not raise this to "use up" spare fast-lane capacity: the two are sized
      # against different resources.
      - key: WEAVR_JOBS_HEAVY_CONCURRENCY
        value: "1"
      # ── yt-dlp cookies — required on Render IPs (YouTube bot check) ─────────
      - key: WEAVR_YTDLP_COOKIES_BASE64
        sync: false
      # ── RapidAPI YouTube — primary metadata+transcript path for YouTube ──────
      - key: WEAVR_RAPID_YT_API_KEY
        sync: false
      # ── YouTube Data API v3 — metadata-only fallback when RapidAPI fails ─────
      - key: WEAVR_YOUTUBE_API_KEY
        sync: false
      # ── Extraction canary — flip to "true" to start periodic platform probes ──
      - key: WEAVR_CANARY_ENABLED
        value: "false"

      # ── Supabase Storage — screenshot upload bucket ──────────────────────────
      - key: WEAVR_SUPABASE_SERVICE_KEY
        sync: false
      - key: WEAVR_SUPABASE_STORAGE_BUCKET
        value: "screenshots"
      # ── Extraction service (Phase 5) — blank until extraction/ is deployed ──
      - key: WEAVR_EXTRACTION_URL
        sync: false
      - key: WEAVR_EXTRACTION_SHARED_SECRET
        sync: false

  # ── Dedicated extraction service ────────────────────────────────────────────
  - type: private_service
    name: weavr-extraction
    runtime: docker
    dockerfilePath: ./extraction/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      # ── Auth — shared secret with weavr-api ─────────────────────────────────
      - key: WEAVR_EXTRACTION_SHARED_SECRET
        sync: false
      # ── Artifact storage ─────────────────────────────────────────────────────
      - key: WEAVR_EXTRACTION_ARTIFACT_SECRET
        sync: false
      - key: WEAVR_EXTRACTION_ARTIFACT_BUCKET
        value: "extraction-artifacts"
      # ── Supabase (same project as weavr-api) ─────────────────────────────────
      - key: WEAVR_SUPABASE_URL
        sync: false
      - key: WEAVR_SUPABASE_SERVICE_KEY
        sync: false
      # ── yt-dlp / RapidAPI (same keys as weavr-api) ───────────────────────────
      - key: WEAVR_RAPID_YT_API_KEY
        sync: false
      - key: WEAVR_YTDLP_COOKIES_BASE64
        sync: false
      # ── App ──────────────────────────────────────────────────────────────────
      - key: PORT
        value: "8081"
      - key: WEAVR_LOG_LEVEL
        value: "INFO"
